name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate App Icon
        run: |
          mkdir -p src/common
          python3 -c "
          import os
          try:
              from PIL import Image, ImageDraw
          except ImportError:
              os.system('pip install pillow')
              from PIL import Image, ImageDraw
          
          img = Image.new('RGBA', (192, 192), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          draw.ellipse([0, 0, 192, 192], fill=(48, 209, 88, 255))
          draw.rectangle([50, 40, 142, 150], fill=(255, 255, 255, 255))
          draw.rectangle([65, 65, 127, 75], fill=(48, 209, 88, 255))
          draw.rectangle([65, 90, 127, 100], fill=(48, 209, 88, 255))
          draw.rectangle([65, 115, 100, 125], fill=(48, 209, 88, 255))
          img.save('src/common/logo.png')
          "

      - name: Build Xiaomi RPK
        run: |
          npm install
          npx aiot build

      - name: Upload RPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-rpk-package
          path: dist/*.rpk
          if-no-files-found: error
