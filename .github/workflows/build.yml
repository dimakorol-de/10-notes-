name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Core Icon
        run: |
          mkdir -p src/common
          # Генерируем 1x1 прозрачный пиксель, который расширяется до валидного PNG
          node -e "
          const fs = require('fs');
          const buf = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==', 'base64');
          fs.writeFileSync('src/common/logo.png', buf);
          "

      - name: Build Xiaomi RPK
        run: |
          npm install
          npx aiot build

      - name: Upload RPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-rpk-package
          path: "**/*.rpk"
          if-no-files-found: error
