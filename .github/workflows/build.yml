name: Build RPK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Xiaomi RPK
        run: |
          npm install
          npx aiot build

      - name: Upload RPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-rpk-package
          path: "**/dist/*.rpk"
          if-no-files-found: error
